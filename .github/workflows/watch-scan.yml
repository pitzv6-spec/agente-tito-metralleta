name: Vigilancia de niveles — la "lupa"

# Dispara POST /api/watch/scan cada 15 min en horario de mercado. Revisa los
# tickers que el usuario marcó con "👁 Vigilar" en la app (máx. 15, ver
# lib/watchStore.ts) y avisa por Discord SOLO si el precio cruzó de verdad un
# soporte/resistencia real (no "está cerca") desde la última revisión.
#
# Complementa — no reemplaza — al resumen matutino y a /ideas, que escanean
# TODO el mercado: esto es vigilancia en tiempo real de una lista corta y a
# propósito, no un reemplazo del descubrimiento de oportunidades nuevas.
#
# Mismo horario que autopilot-scan.yml (13:00-21:45 UTC cubre 9:30-16:00 ET
# en verano e invierno). Requiere los mismos secrets: TITO_DEPLOY_URL,
# CRON_SECRET.

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      debug_ticker:
        description: "TEMPORAL: ticker para forzar un cruce de prueba (vacío = pase normal)"
        required: false
      debug_prev_spot:
        description: "TEMPORAL: prevSpot falso"
        required: false
      debug_spot:
        description: "TEMPORAL: spot falso"
        required: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/watch/scan
        run: |
          if [ -n "${DEBUG_TICKER}" ]; then
            BODY="{\"debug\":{\"ticker\":\"${DEBUG_TICKER}\",\"prevSpot\":${DEBUG_PREV_SPOT},\"spot\":${DEBUG_SPOT}}}"
          else
            BODY="{}"
          fi
          curl -sS -X POST "${TITO_DEPLOY_URL}/api/watch/scan" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            -w "\nHTTP %{http_code}\n" \
            --fail-with-body \
            --max-time 60
        env:
          TITO_DEPLOY_URL: ${{ secrets.TITO_DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEBUG_TICKER: ${{ inputs.debug_ticker }}
          DEBUG_PREV_SPOT: ${{ inputs.debug_prev_spot }}
          DEBUG_SPOT: ${{ inputs.debug_spot }}
      - name: Avisar por Discord si la vigilancia en sí falló
        if: failure()
        run: |
          curl -sS -X POST "${DISCORD_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ **Vigilancia de niveles falló** — /api/watch/scan no respondió. Revisa los logs en la pestaña Actions.\"}" \
            -w "\nHTTP %{http_code}\n"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
