name: Piloto automático — escaneo periódico

# Dispara POST /api/autopilot/scan en el despliegue de Vercel cada 15 min,
# aprox. en horario de mercado de EE.UU. (13:00-21:45 UTC cubre 9:30-16:00 ET
# tanto en horario de verano como de invierno; correr algo fuera de ventana
# los días de mercado cerrado no hace daño, solo un escaneo de más).
#
# Requiere dos secrets en este repo (Settings → Secrets and variables → Actions):
#   TITO_DEPLOY_URL  → ej. https://tu-proyecto.vercel.app
#   CRON_SECRET      → el mismo valor que CRON_SECRET en las env vars de Vercel

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/autopilot/scan
        run: |
          curl -sS -X POST "${TITO_DEPLOY_URL}/api/autopilot/scan" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -w "\nHTTP %{http_code}\n" \
            --fail-with-body
        env:
          TITO_DEPLOY_URL: ${{ secrets.TITO_DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
